[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beampilot"
version = "0.1.0"
description = "Agentic laser beam characterisation (ISO 11146, M²) with Meta models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "matplotlib",
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
# Demo UI only (python -m beampilot.app); not needed for the core package.
demo = [
    "gradio==6.30.0",
]

[project.urls]
Repository = "https://github.com/Farshadmhd/beampilot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beampilot = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
